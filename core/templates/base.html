<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="https://atugatran.github.io/FontAwesome6Pro/css/all.min.css" />
	<link rel="stylesheet" href="{% static 'css/reset.css' %}" />
	<link rel="stylesheet" href="{% static 'css/style.css' %}" />
	<link rel="stylesheet" href="{% static 'css/responsive.css' %}" />
	<link rel="stylesheet" href="{% static 'css/dark_mode.css' %}??" />
	{% block css %}{% endblock css %}
	<title>{% block title %}{% endblock title %}Div Telecom</title>
</head>
<body data-bs-theme="light">
	{% include "includes/navbar.html" %}
	
	{% block content %}
	
	{% endblock content %}
	
	{% include "includes/footer.html" %}
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" ></script>
	<script src="https://code.jquery.com/jquery-migrate-3.5.0.min.js"></script>

	<script>
	const user_is_authenticated = "{{ user.is_authenticated }}";
	const username = "{{ user.username }}";
	const user_full_name = "{{ user.full_name }}";
	const csrftoken = "{{ csrf_token }}";

	jQuery.ajaxSetup({
		headers: { "X-CSRFToken": csrftoken },
	});

	$('input[name="search"]').on("input", (e) => {
		const query = e.target.value;
		window.history.replaceState(null, null, `?search=${query}`);
	});

	const $body = $(document.body);
	const $hero_dark = $("#hero-dark");
	const $hero_light = $("#hero-light");
	function setTheme(theme) {
		// const transitionDuration = 200;
		if (theme == "dark") {
		$body.attr("data-bs-theme", "dark");
		$body.addClass("dark");
		$hero_dark.show();
		$hero_light.hide();
		$("button.btn").addClass("btn-dark");
		} else {
		$body.attr("data-bs-theme", "light");
		$body.removeClass("dark");
		$hero_dark.hide();
		$hero_light.show();
		$("button.btn").removeClass("btn-dark");
		}
		localStorage.setItem("theme", theme);
	}

	function toggleTheme() {
		let theme = localStorage.getItem("theme") || "light";
		if (theme == "light") {
		theme = "dark";
		} else {
		theme = "light";
		}
		setTheme(theme);
	}

	setTheme(localStorage.theme);
	$(".theme-toggle").on("click", toggleTheme);

	// $('.nav-item .nav-link').on('click', (e) => {
	//     sessionStorage.setItem('activeTab', e.target.pathname+e.target.search)
	// })
	// let activeTab = sessionStorage.getItem('activeTab')

	const activeTab = (location.pathname + location.search)
		.replace(/(&|\?)brand=[^&]*/, "")
		.replace(/\/&/, "/?");
	$(`.nav-item .nav-link[href="${activeTab}"]`).addClass("active");
	</script>

	{% block js %}{% endblock js %}
</body>
</html>

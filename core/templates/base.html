{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="https://atugatran.github.io/FontAwesome6Pro/css/all.min.css" />
	<link rel="stylesheet" href="{% static 'css/reset.css' %}" />
	<link rel="stylesheet" href="{% static 'css/font.css' %}" />
	<link rel="stylesheet" href="{% static 'css/style.css' %}" />
	<link rel="stylesheet" href="{% static 'css/dark_mode.css' %}" />
	{% block css %}{% endblock css %}
	<title>{% block title %}{% endblock title %}Project X</title>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		const user = {
			isAuthenticated: '{{ user.is_authenticated }}' == 'True',
			username: '{{ user.username }}',
			fullName: '{{ user.full_name }}',
		};

		jQuery.ajaxSetup({
			headers: { 'X-CSRFToken': '{{ csrf_token }}', },
		});

		function setTheme(theme) {
			theme = theme === 'dark' ? 'dark' : 'light';
			$(':root').attr('data-bs-theme', theme);
			localStorage.setItem('theme', theme);
		}

		setTheme(localStorage.getItem("theme") || "light");
	</script>
</head>
<body>
	{% include "components/navbar.html" %}
	
	{% block content %}
	
	{% endblock content %}
	
	{% include "components/footer.html" %}
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script>

	const cacheOverride = true; // Set to true only for development
	if (cacheOverride) {
		const cacheOverrideToken = Math.floor(Math.random() * 1000);
		$('link[href^="/static/"]').each((i, el) => {
			el.href += `?_cacheOverride=${cacheOverrideToken + i}`;
		})
	}

	const $search = $('input[name="search"]');
	const searchValueLength = $search.val().length;
	if (searchValueLength) {
		$search.focus(() => {
			const inputElement = $search.get(0);
			inputElement.setSelectionRange(searchValueLength, searchValueLength)
		});
		$search.focus()
	}

	// let searchTimeout;
	// $search.on("input", () => {
	// 	const query = $search.val();
	// 	clearTimeout(searchTimeout);
	// 	searchTimeout = setTimeout(() => {
	// 		location.href = `{% url 'core:list' %}?search=${query}`;
	// 	}, 500);
	// });

	function toggleTheme() {
		const isDark = localStorage.getItem('theme') === 'dark';
		setTheme(isDark ? 'light' : 'dark');
	}

	$('.theme-toggle').on('click', toggleTheme);

	const activeLink = $(`.nav-link[href="${location.pathname}"]`).addClass('active').get(0);
	if (activeLink) activeLink.scrollIntoView({ behavior: 'auto', block: 'center' });

	</script>
	{% block js %}{% endblock js %}
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous"> -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="https://atugatran.github.io/FontAwesome6Pro/css/all.min.css" />
	<link rel="stylesheet" href="{% static 'css/reset.css' %}" />
	<link rel="stylesheet" href="{% static 'css/style.css' %}?" />
	<link rel="stylesheet" href="{% static 'css/dark_mode.css' %}?" />
	{% block css %}{% endblock css %}
	<title>{% block title %}{% endblock title %}Div Telecom</title>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		const user = {
			isAuthenticated: "{{ user.is_authenticated }}",
			username: "{{ user.username }}",
			fullName: "{{ user.full_name }}"
		};

		jQuery.ajaxSetup({
			headers: { "X-CSRFToken": "{{ csrf_token }}" },
		});

		function setTheme(theme) {
			const isDark = theme === "dark";
			$(":root").attr("data-bs-theme", isDark ? "dark" : "light");
			localStorage.setItem("theme", theme);
		}

		setTheme(localStorage.getItem("theme") || "light");
	</script>
</head>
<body>
	{% include "components/navbar.html" %}
	
	{% block content %}
	
	{% endblock content %}
	
	{% include "components/footer.html" %}
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" ></script>
	<script>

	let searchTimeout;
	$('input[name="search"]').on("input", (e) => {
		const query = e.target.value;
		clearTimeout(searchTimeout);
		searchTimeout = setTimeout(() => {
			window.history.replaceState(null, null, `?search=${query}`);
		}, 300);
	});

	function toggleTheme() {
		const isDark = localStorage.getItem("theme") === "dark";
		setTheme(isDark ? "light" : "dark");
	}

	$(".theme-toggle").on("click", toggleTheme);

	// $('.nav-item .nav-link').on('click', (e) => {
	//     sessionStorage.setItem('activeTab', e.target.pathname+e.target.search)
	// })
	// let activeTab = sessionStorage.getItem('activeTab')

	const activeTab = (location.pathname + location.search)
		.replace(/(&|\?)brand=[^&]*/, "")
		.replace(/\/&/, "/?");
	$(`.nav-item .nav-link[href="${activeTab}"]`).addClass("active");

	</script>
	{% block js %}{% endblock js %}
</body>
</html>

<body>
{% include "includes/navbar.html" %}
{% block content %}

{% endblock content %}
{% include "includes/footer.html" %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-migrate-3.5.0.min.js"></script>

<script>
    
    const username = '{{ user.username }}'
    const user_full_name = '{{ user.full_name }}'
    const csrftoken = $('input[name="csrfmiddlewaretoken"]').val()

    jQuery.ajaxSetup({
        headers: { "X-CSRFToken": csrftoken }
    });

    $('input[name="search"]').on('input', (e) => {
        let query = e.target.value
        window.history.replaceState(null, null, `?search=${query}`)
    })

    function setTheme(theme){
        if (theme=='dark'){
            $('body').addClass('dark')
            $('button.btn').addClass('btn-dark')
        } else {
            $('body').removeClass('dark')
            $('button.btn').removeClass('btn-dark')
        }
        localStorage.setItem('theme', theme)
    }

    function toggleTheme() {
        let theme = localStorage.getItem('theme')
        if (theme == 'light') {
            theme = 'dark'
        } else {
            theme = 'light'
        }
        setTheme(theme)
    }
    setTheme(localStorage.theme)

    // $('.nav-item .nav-link').on('click', (e) => {
    //     sessionStorage.setItem('activeTab', e.target.pathname+e.target.search)
    // })
    // let activeTab = sessionStorage.getItem('activeTab')
    
    let activeTab = location.pathname + location.search
    activeTab = activeTab.replace(/(&|\?)brand=[^&]*/, '').replace(/\/&/, '/?')
    $(`.nav-item .nav-link[href="${activeTab}"]`).addClass('active')
</script>

{% block js %}{% endblock js %}

</body>
</html>

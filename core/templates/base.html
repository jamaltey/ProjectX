{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="{% static 'css/reset.css' %}" />
        <link rel="stylesheet" href="{% static 'css/font.css' %}" />
        <link rel="stylesheet" href="{% static 'css/style.css' %}" />
        <link rel="stylesheet" href="{% static 'css/dark-theme.css' %}" />
        {% block css %}{% endblock css %}
        <title>{% block title %}{% endblock title %}Project X</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script>
            const user = {
                isAuthenticated: '{{ user.is_authenticated }}' == 'True',
                email: '{{ user.email }}' || null,
                fullName: '{{ user.full_name }}' || null,
            };

            jQuery.ajaxSetup({
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
            });

            setTheme(localStorage.theme);

            function setTheme(theme) {
                theme = ['dark', 'light'].includes(theme) ? theme : 'auto';
                localStorage.setItem('theme', theme);
                showSelectedTheme(theme);
                if (theme == 'auto') {
                    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    theme = prefersDarkScheme ? 'dark' : 'light';
                }
                $(':root').attr('data-bs-theme', theme);
            }

            function showSelectedTheme(theme) {
                theme = theme == 'dark' ? 'Dark' : theme == 'light' ? 'Light' : 'Auto';
                const icon = theme == 'Light' ? 'sun' : theme == 'Dark' ? 'moon' : 'circle-half-stroke';
                $('#theme-dropdown .dropdown-toggle').html(`
                    <i class="fas fa-${icon} me-1"></i>
                    ${theme}
                `);
                $(`#theme-dropdown [data-theme-value]`).removeClass('active');
                $(`#theme-dropdown [data-theme-value=${theme.toLowerCase()}]`).addClass('active');
            }

            $(window.matchMedia('(prefers-color-scheme: dark)')).on('change', () => {
                if (!['dark', 'light'].includes(localStorage.theme)) {
                    setTheme('auto');
                }
            });
        </script>
    </head>
    <body>
        {% include "components/navbar.html" %}

        {% block content %}
        {% endblock content %}

        {% include "components/footer.html" %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script>
            const cacheOverride = false; // Set to true only for development
            if (cacheOverride) {
                const cacheOverrideToken = Math.floor(Math.random() * 1000);
                $('link[href^="/static/"]').each((i, el) => {
                    el.href += `?_cacheOverride=${cacheOverrideToken + i}`;
                });
            }

            const $search = $('input#search');
            const $searchForm = $('#search-form');

            $searchForm.on('submit', function (e) {
                const search = $search.val().trim();
                return !!search;
            });

            $('[data-theme-value]').on('click', function () {
                const theme = $(this).data('theme-value');
                setTheme(theme);
            });
            showSelectedTheme(localStorage.theme);

            const activeLink = $(`.nav-link[href="${location.pathname}"]`).addClass('active').get(0);
            if (activeLink) activeLink.scrollIntoView({ behavior: 'auto', block: 'center' });
        </script>
        {% block js %}{% endblock js %}
    </body>
</html>

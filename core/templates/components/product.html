<div id="{{ product.id }}" class="col-6 col-md-4 col-xl-3 product">
    <div class="card h-100">
        <a href="{% url 'core:detail' product.id %}">
            <img class="card-img-top" src="{{ product.image.url }}" alt="{{ product.title }} image">
        </a>
        <div class="card-body d-flex justify-content-between align-items-start">
            <a href="{% url 'core:detail' product.id %}">
                <h5 class="card-title">{{ product.title }}</h5>

                <p class="card-text price">
                    {% if product.old_price %}
                        <span id="old-price" class="card-text">{{ product.old_price }} $</span>{{ product.price }} $
                    {% else %}
                        {{ product.price }} $
                    {% endif %}
                </p>
            </a>

            <button class="heart btn rounded-circle p-2" onclick="updateFavorites('{{ product.id }}')">
                {% if not product in favorites %}
                    <i class="fa-regular fa-heart"></i>
                {% else %}
                    <i class="fa-solid fa-heart"></i>
                {% endif %}
            </button>
        </div>
    </div>
</div>

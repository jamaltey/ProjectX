<div id="product-{{ product.id }}" class="product col-6 col-md-4 col-xl-3">
    <div class="card h-100">
        <a class="card-img-top d-flex justify-content-center bg-white" href="{{ product.get_absolute_url }}">
            <img class="card-img-top object-fit-cover w-auto" height="200" src="{{ product.image.url }}" alt="{{ product.name }} image">
        </a>
        <div class="card-body d-flex justify-content-between align-items-start">
            <a class="d-flex flex-column justify-content-between h-100" href="{{ product.get_absolute_url }}">
                <h5 class="card-title me-1">{{ product.name }}</h5>

                <div class="card-text d-flex flex-column flex-sm-row align-items-sm-center">
                    {% if product.old_price %}
                        <span class="old-price text-decoration-line-through flex-shrink-0 me-2">{{ product.old_price }}</span>
                    {% endif %}
                    <span class="price flex-shrink-0">{{ product.price }}</span>
                </div>
            </a>

            <button class="heart btn rounded-circle" type="button" onclick="updateFavorites('{{ product.id }}')">
                {% if not product in favorites %}
                    <i class="fa-regular fa-heart"></i>
                {% else %}
                    <i class="fa-solid fa-heart"></i>
                {% endif %}
            </button>
        </div>
    </div>
</div>
